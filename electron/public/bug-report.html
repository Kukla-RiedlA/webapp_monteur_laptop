<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bugreport</title>
  <link rel="stylesheet" href="ui-theme.css" />
  <link rel="stylesheet" href="css/kukla-brand.css" />
  <link rel="stylesheet" href="css/bug_report_panel.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #f5f5f5); }
  </style>
</head>
<body>
  <div id="bugReportApp" class="bug-report-app bug-report-popup">
    <div class="bug-report-shell">
      <div class="bug-report-head">
        <h1>Bugreport</h1>
        <div class="bug-report-head-actions">
          <button type="button" class="btn" data-br-pin>Anheften</button>
        </div>
      </div>
      <div class="bug-report-tabs" role="tablist">
        <button type="button" role="tab" data-br-pane-tab="list" aria-selected="true">Liste</button>
        <button type="button" role="tab" data-br-pane-tab="new" aria-selected="false">Neuer Eintrag</button>
      </div>
      <div class="bug-report-status" data-br-status></div>
      <div data-br-pane="list"></div>
      <div data-br-pane="new" hidden></div>
    </div>
  </div>
  <script src="js/bug-report-window-boot.js"></script>
  <script src="js/bug_report_panel.js"></script>
</body>
</html>
