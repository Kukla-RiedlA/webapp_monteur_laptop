<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KUKpit UI-Demo</title>
  <style>
    :root {
      --kukla: #0e7b5a;
      --kukla-deep: #0a5a48;
      --kukla-facet: #0b4f43;
      --facet-angle: 36deg;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f3f4f4; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
    .app-header {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(90deg, #0e7b5a 0%, #14926e 55%, #1aa57c 100%);
    }
    .header-facet {
      position: absolute;
      top: 0;
      right: 0;
      width: 420px;
      height: 82px;
      background: linear-gradient(90deg, #156b58 0%, #0b4f43 48%, #07352e 100%);
      clip-path: polygon(88px 0, 100% 0, 100% 100%, 28px 100%);
      pointer-events: none;
      z-index: 1;
    }
    .header-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      min-height: 82px;
      padding: 10px 16px 10px 18px;
    }
    .logo-plate {
      background: #fff;
      border-radius: 8px;
      height: 54px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .logo-plate img { height: 46px; width: auto; display: block; }
    .brand-rule {
      width: 1px;
      height: 42px;
      margin: 0 14px;
      background: rgba(255,255,255,0.45);
      flex-shrink: 0;
    }
    .brand-title {
      margin: 0;
      font-size: 32px;
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .brand-title .pit { font-weight: 500; }
    .brand-tagline {
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      opacity: 0.8;
      white-space: nowrap;
    }
    .win-controls {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      z-index: 4;
    }
    .win-btn {
      width: 42px;
      height: 26px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,0.88);
      font-size: 13px;
    }
    .win-btn:hover { background: rgba(255,255,255,0.12); }
    .win-btn.close:hover { background: #c42b1c; color: #fff; }
    .header-claim {
      position: absolute;
      right: 22px;
      top: 28px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-claim-slash {
      width: 1.5px;
      height: 52px;
      background: rgba(255,255,255,0.78);
      transform: rotate(var(--facet-angle));
      flex-shrink: 0;
    }
    .header-claim-text {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      line-height: 1.3;
      text-transform: uppercase;
      text-align: right;
      color: rgba(255,255,255,0.82);
    }
    .header-rule {
      position: relative;
      z-index: 2;
      height: 1px;
      background: rgba(255,255,255,0.4);
    }
    .app-nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px 10px;
      min-height: 48px;
    }
    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,0.95);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      white-space: nowrap;
    }
    .nav-item svg { width: 16px; height: 16px; }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.is-active {
      background: #fff;
      color: #0e7b5a;
      font-weight: 600;
    }
    .nav-drop { position: relative; }
    .nav-drop-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 210px;
      background: #fff;
      color: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      padding: 6px;
      z-index: 30;
    }
    .nav-drop:hover .nav-drop-menu { display: block; }
    .nav-drop-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 8px 10px;
      border-radius: 6px;
      font: inherit;
      font-size: 13.5px;
    }
    .nav-drop-item:hover { background: #eef5f3; color: #0c6b4f; }
    .nav-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 14px;
      border-left: 1px solid rgba(255,255,255,0.55);
      min-height: 28px;
      font-size: 13px;
    }
    .user-name { white-space: nowrap; }
    .badge-sync {
      background: #6b45d6;
      color: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(8, 40, 34, 0.35);
      border: 1px solid rgba(255,255,255,0.16);
    }
    .dot-online {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6cff9a;
    }
    .meta-sep {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.45);
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: 0;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .theme-toggle {
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: #7dffa0;
      position: relative;
      flex-shrink: 0;
    }
    .theme-toggle::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      right: 2px;
    }
    .version { font-size: 11px; opacity: 0.75; white-space: nowrap; }
    .page { min-height: 360px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-facet" aria-hidden="true"></div>
    <div class="win-controls" aria-label="Fenster">
      <button type="button" class="win-btn" aria-label="Minimieren">–</button>
      <button type="button" class="win-btn" aria-label="Maximieren">□</button>
      <button type="button" class="win-btn close" aria-label="Schließen">×</button>
    </div>
    <div class="header-top">
      <div class="logo-plate">
        <img src="assets/img/kukla_logo_claim_green.png" alt="KUKLA">
      </div>
      <span class="brand-rule"></span>
      <div>
        <h1 class="brand-title">KUK<span class="pit">pit</span></h1>
        <div class="brand-tagline">Kukla Monteur Cockpit</div>
      </div>
      <div class="header-claim">
        <span class="header-claim-slash" aria-hidden="true"></span>
        <p class="header-claim-text">Weighing<br>Precision<br>in every project</p>
      </div>
    </div>
    <div class="header-rule"></div>
    <nav class="app-nav" aria-label="Hauptnavigation">
      <button type="button" class="nav-item is-active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 4 10v10h6v-6h4v6h6V10z"/></svg>
        Start
      </button>
      <button type="button" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="3.5" width="10" height="17" rx="1.5"/><path d="M10 8h4M10 12h4M10 16h2.5"/></svg>
        Aufträge
      </button>
      <div class="nav-drop">
        <button type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="4" width="12" height="16" rx="1.5"/><path d="M9 8h6M9 12h6"/></svg>
          Protokolle ▾
        </button>
        <div class="nav-drop-menu">
          <button type="button" class="nav-drop-item">Arbeitsnachweis</button>
          <button type="button" class="nav-drop-item">Montagebericht</button>
          <button type="button" class="nav-drop-item">Parameterlisten</button>
          <button type="button" class="nav-drop-item">Kontrollwiegungen</button>
          <button type="button" class="nav-drop-item">Schleppketten-Test</button>
          <button type="button" class="nav-drop-item">Prüfzertifikat</button>
          <button type="button" class="nav-drop-item">Inbetriebnahme</button>
          <button type="button" class="nav-drop-item">Service</button>
          <button type="button" class="nav-drop-item">Protokolle für Kunden</button>
        </div>
      </div>
      <button type="button" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="7" rx="6" ry="2.3"/><path d="M6 7v5c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4V7M6 12v5c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4v-5"/></svg>
        Anlagenstamm
      </button>
      <div class="nav-drop">
        <button type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
          Office ▾
        </button>
        <div class="nav-drop-menu">
          <button type="button" class="nav-drop-item">Abrechnung</button>
          <button type="button" class="nav-drop-item">Zeitschreibung</button>
          <button type="button" class="nav-drop-item">Abwesenheiten</button>
          <button type="button" class="nav-drop-item">Arbeitsschritte</button>
        </div>
      </div>
      <button type="button" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h6l2 2h8v10H4z"/></svg>
        Archiv
      </button>
      <div class="nav-meta">
        <button type="button" class="icon-btn" aria-label="Montagehinweise">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 21h6v-1.5H9V21zm3-19a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>
        </button>
        <span class="user-name">Riedl Alois ▾</span>
        <span class="badge-sync">Sync 1</span>
        <span class="online-pill"><span class="dot-online"></span> Online</span>
        <span class="meta-sep"></span>
        <button type="button" class="icon-btn" aria-label="Suche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        </button>
        <button type="button" class="icon-btn" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.4l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1A2 2 0 1 1 19.6 7l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <span class="theme-toggle" title="Theme"></span>
        <span class="version">V 2.007.019</span>
      </div>
    </nav>
  </header>
</body>
</html>
